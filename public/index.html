<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: env(safe-area-inset-*) працює на iPhone, таб-бар піднімається над home indicator -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      /* Фон теми з першого кадру — до завантаження JS (src/theme/tokens.ts) */
      :root {
        --bg: #e7eae6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101315;
          color-scheme: dark;
        }
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Увімкніть JavaScript, щоб запустити застосунок.</noscript>
    <div id="root"></div>
  </body>
</html>
